services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zm_terminal}
      POSTGRES_USER: ${POSTGRES_USER:-zm_terminal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zm_terminal_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zm_terminal} -d ${POSTGRES_DB:-zm_terminal}"]
      interval: 5s
      timeout: 5s
      retries: 10

  openbb:
    build:
      context: ./docker/openbb
    environment:
      FRED_API_KEY: ${FRED_API_KEY:-}
    ports:
      - "6900:6900"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6900/openapi.json', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s

  api:
    build:
      context: ./apps/api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://zm_terminal:zm_terminal_dev@postgres:5432/zm_terminal}
      OPENBB_URL: ${OPENBB_URL:-http://openbb:6900}
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
    depends_on:
      postgres:
        condition: service_healthy
      openbb:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build:
      context: ./apps/web
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - api
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
  web_node_modules:

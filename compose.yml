# One authoritative source for the application role's credentials: the Postgres container creates the role from these values and the
# API container connects with the same ones. The admin POSTGRES_PASSWORD is never given to the API container.
x-app-db: &app-db
  APP_DB_USER: ${APP_DB_USER:-zm_terminal_app}
  APP_DB_PASSWORD: ${APP_DB_PASSWORD:-zm_terminal_app_dev}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zm_terminal}
      POSTGRES_USER: ${POSTGRES_USER:-zm_terminal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zm_terminal_dev}
      <<: *app-db
      PGOPTIONS: -c zm.app_role=${APP_DB_USER:-zm_terminal_app}  # tells db/init/015_application_role.sql which role to create
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zm_terminal} -d ${POSTGRES_DB:-zm_terminal}"]
      interval: 5s
      timeout: 5s
      retries: 10

  openbb:
    build:
      context: ./docker/openbb
    environment:
      FRED_API_KEY: ${FRED_API_KEY:-}
    ports:
      - "127.0.0.1:6900:6900"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6900/openapi.json', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s

  api:
    build:
      context: ./apps/api
    environment:
      <<: *app-db
      APP_DB_HOST: postgres
      APP_DB_NAME: ${POSTGRES_DB:-zm_terminal}
      POSTGRES_USER: ${POSTGRES_USER:-zm_terminal}  # the admin role NAME only (not its password): the API refuses to connect as it
      DATABASE_URL: ${DATABASE_URL:-}  # optional override of the APP_DB_* settings; must not name the admin role
      OPENBB_URL: ${OPENBB_URL:-http://openbb:6900}
      BOZ_USD_RATES_URL: ${BOZ_USD_RATES_URL:-https://www.boz.zm/api/v1/views/boz_zmw_usd_daily_exchange_rates}
      MOA_MEDIA_URL: ${MOA_MEDIA_URL:-https://www.agriculture.gov.zm/wp-json/wp/v2/media}
      MOA_CA_BUNDLE: ${MOA_CA_BUNDLE:-}
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
    depends_on:
      postgres:
        condition: service_healthy
      openbb:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build:
      context: ./apps/web
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - api
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
  web_node_modules:
